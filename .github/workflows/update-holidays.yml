name: Update hari libur

on:
  schedule:
    - cron: "0 0 * * *" # setiap hari 00:00 UTC
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil data dari API dan gabungkan dengan holidays.json
        run: |
          curl -fsSL https://api.kemendesa.link/libur-nasional/api/holidays/latest -o new.json
          python3 - <<'PY'
          import json, os
          new = json.load(open('new.json'))['data']
          old = json.load(open('holidays.json'))['data'] if os.path.exists('holidays.json') else []
          merged = {h['date']: h for h in old}
          merged.update({h['date']: h for h in new})
          out = {'data': [merged[k] for k in sorted(merged)]}
          json.dump(out, open('holidays.json', 'w'), ensure_ascii=False, indent=1)
          PY
          rm new.json

      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add holidays.json
          if ! git diff --staged --quiet; then
            git commit -m "Update data hari libur"
            git push
          fi
